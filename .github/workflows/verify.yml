name: Demo Pulumi npm trusted publishing

on:
  workflow_dispatch:
    inputs:
      pulumi_repo:
        description: Repository containing the Pulumi source to build
        required: true
        default: pulumi/pulumi
      pulumi_ref:
        description: Branch, tag, or SHA containing the publishToNPM trusted-publishing change
        required: true
        default: apose/pvd-4214-migrate-provider-npm-publishing-to-trusted-publishing-oidc
      package_name:
        description: npm package name configured for trusted publishing
        required: true
        default: '@pose/pulumi-npm-oidc-verify'
      package_version:
        description: New npm package version to publish. Leave empty to auto-generate a demo prerelease version.
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

run-name: Demo npm trusted publishing from ${{ inputs.pulumi_ref }}

jobs:
  publish:
    name: Build Pulumi and publish test package
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Check out verification fixture
        uses: actions/checkout@v4
        with:
          path: fixture

      - name: Select package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.package_version }}'
          if [[ -z "$version" ]]; then
            version="0.0.2-demo.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi
          package_url="https://www.npmjs.com/package/${{ inputs.package_name }}/v/$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_url=$package_url" >> "$GITHUB_OUTPUT"
          echo "Package: ${{ inputs.package_name }}@$version" >> "$GITHUB_STEP_SUMMARY"
          echo "npm package URL: $package_url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::npm package URL will be $package_url"

      - name: Check out Pulumi source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pulumi_repo }}
          ref: ${{ inputs.pulumi_ref }}
          path: pulumi

      - name: Set up Go for Pulumi build
        uses: actions/setup-go@v6
        with:
          go-version-file: pulumi/pkg/go.mod
          cache-dependency-path: |
            pulumi/pkg/go.sum
            pulumi/sdk/go.sum

      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('pulumi/pkg/go.sum', 'pulumi/sdk/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Build Pulumi binary from selected ref
        working-directory: pulumi
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -C pkg \
            -o ../bin/pulumi \
            -ldflags "-X github.com/pulumi/pulumi/sdk/v3/go/common/version.Version=dev" \
            github.com/pulumi/pulumi/pkg/v3/cmd/pulumi
          ./bin/pulumi version

      - name: Set up Node for npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm version used for trusted publishing
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          npm install -g npm@11.19.0
          npm --version
          node --version

      - name: Assert trusted publishing environment
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          npm_version="$(npm --version)"
          node -e 'const [maj,min,patch] = process.argv[1].split(/[.-]/).map(Number); if (maj < 11 || (maj === 11 && min < 5) || (maj === 11 && min === 5 && patch < 1)) process.exit(1)' "$npm_version"
          {
            echo "### Trusted publishing environment"
            echo "- GitHub-hosted runner: yes"
            echo "- GitHub Actions OIDC request URL present: yes"
            echo "- NODE_AUTH_TOKEN set in publish step: no"
            echo "- npm version: $npm_version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare package metadata
        working-directory: fixture/sdk/nodejs
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          npm pkg set name="${{ inputs.package_name }}" version="${{ steps.version.outputs.version }}"
          npm pkg delete private
          cat package.json

      - name: Publish with Pulumi package publish-sdk
        working-directory: fixture
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          echo "Publishing ${{ inputs.package_name }}@${{ steps.version.outputs.version }}"
          echo "npm package URL: ${{ steps.version.outputs.package_url }}"
          ../pulumi/bin/pulumi package publish-sdk nodejs --path ./sdk/nodejs
          echo "Published ${{ inputs.package_name }}@${{ steps.version.outputs.version }} with NODE_AUTH_TOKEN unset" >> "$GITHUB_STEP_SUMMARY"

      - name: Report publish failure
        if: failure()
        run: |
          {
            echo "### Publish failed"
            echo "- Package: ${{ inputs.package_name }}@${{ steps.version.outputs.version }}"
            echo "- URL: ${{ steps.version.outputs.package_url }}"
            echo "- NODE_AUTH_TOKEN was intentionally unset so this exercises npm trusted publishing/OIDC."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read npm package metadata
        if: success()
        working-directory: fixture
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          package="${{ inputs.package_name }}@${{ steps.version.outputs.version }}"
          url="https://www.npmjs.com/package/${{ inputs.package_name }}/v/${{ steps.version.outputs.version }}"
          echo "npm package URL: $url"
          for i in $(seq 1 30); do
            if npm view "$package" --json > npm-view.json; then
              cat npm-view.json
              {
                echo "### npm metadata"
                echo "- Package metadata is visible"
                echo "- URL: $url"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "npm metadata not visible yet; npm may still be validating the version (attempt $i/30): $url"
            sleep 60
          done
          {
            echo "### npm metadata"
            echo "- Publish succeeded, but npm metadata was still unavailable after retries"
            echo "- npm may still show the version as Validating"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::npm metadata was still unavailable; publish may still be validating"
